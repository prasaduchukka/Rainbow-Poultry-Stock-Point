    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8088}